    <!-- BONG BÓNG THÔNG BÁO LỊCH NỞ -->
    <div id="floatingNotification" class="fixed bottom-6 right-6 z-[99999] cursor-pointer hidden select-none touch-none">
        <div id="floatingBtn" class="relative bg-emerald-600 hover:bg-emerald-700 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center border-2 border-white transition-transform active:scale-95">
            <i class="fa-solid fa-message text-2xl"></i>
            <span id="notifBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full shadow hidden">0</span>
        </div>

        <div id="notifDropdown" class="hidden absolute bottom-16 right-0 w-72 sm:w-80 bg-white text-gray-800 rounded-xl shadow-2xl border border-gray-200 overflow-hidden">
            <div class="bg-emerald-800 text-white px-4 py-3 font-semibold flex justify-between items-center cursor-default">
                <span><i class="fa-solid fa-bell mr-1"></i> Lịch Nở Hôm Nay</span>
                <span id="notifCountText" class="text-xs bg-emerald-600 px-2 py-0.5 rounded-full">0 đơn</span>
            </div>
            <div id="notifList" class="max-h-72 overflow-y-auto divide-y divide-gray-100 text-sm">
            </div>
        </div>
    </div>

    <script>
        const ADMIN_USERNAME = "admin";
        const ADMIN_PASSWORD = "12345678t";

        let currentUser = localStorage.getItem('currentUser') || null;
        let cachedOrdersForExport = [];

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('orderDate').valueAsDate = new Date();
            updateDefaultPrice();
            checkAuthState();
            initDraggableFloatingButton();

            window.addEventListener('click', function(e) {
                const dropdown = document.getElementById('notifDropdown');
                const bubble = document.getElementById('floatingNotification');
                if (!bubble.contains(e.target) && !dropdown.classList.contains('hidden')) {
                    dropdown.classList.add('hidden');
                }
            });
        });

        function initDraggableFloatingButton() {
            const el = document.getElementById('floatingNotification');
            let isDragging = false;
            let startX, startY, initialX, initialY;

            el.addEventListener('pointerdown', dragStart);
            document.addEventListener('pointermove', drag);
            document.addEventListener('pointerup', dragEnd);

            function dragStart(e) {
                isDragging = false;
                startX = e.clientX;
                startY = e.clientY;
                const rect = el.getBoundingClientRect();
                initialX = rect.left;
                initialY = rect.top;
                el.setPointerCapture(e.pointerId);
            }

            function drag(e) {
                if (!startX || !startY) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    isDragging = true;
                    el.style.left = (initialX + dx) + 'px';
                    el.style.top = (initialY + dy) + 'px';
                    el.style.bottom = 'auto';
                    el.style.right = 'auto';
                }
            }

            function dragEnd(e) {
                if (!isDragging) {
                    document.getElementById('notifDropdown').classList.toggle('hidden');
                }
                startX = null;
                startY = null;
                isDragging = false;
            }
        }

        function formatMoney(amount) {
            return Number(amount).toLocaleString('en-US') + ' đ';
        }

        function updateDefaultPrice() {
            const breedSelect = document.getElementById('breedType');
            const selectedOption = breedSelect.options[breedSelect.selectedIndex];
            document.getElementById('breedPrice').value = selectedOption.getAttribute('data-price');
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = "flex-1 pb-2 font-semibold text-emerald-700 border-b-2 border-emerald-600";
                tabRegister.className = "flex-1 pb-2 font-semibold text-gray-400";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.className = "flex-1 pb-2 font-semibold text-emerald-700 border-b-2 border-emerald-600";
                tabLogin.className = "flex-1 pb-2 font-semibold text-gray-400";
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim().replace(/[.#$\[\]]/g, "_");
            const password = document.getElementById('regPassword').value;

            if (username === ADMIN_USERNAME) {
                alert('Tên tài khoản này đã được dùng làm hệ thống quản trị!');
                return;
            }

            db.ref('users/' + username).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    alert('Tên tài khoản này đã tồn tại!');
                } else {
                    db.ref('users/' + username).set({ password: password }, (error) => {
                        if (!error) {
                            alert('Đăng ký thành công! Hãy đăng nhập.');
                            switchTab('login');
                        }
                    });
                }
            });
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim().replace(/[.#$\[\]]/g, "_");
            const password = document.getElementById('loginPassword').value;

            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                currentUser = username;
                localStorage.setItem('currentUser', currentUser);
                checkAuthState();
                return;
            }

            db.ref('users/' + username).once('value', (snapshot) => {
                const userData = snapshot.val();
                if (userData && userData.password === password) {
                    currentUser = username;
                    localStorage.setItem('currentUser', currentUser);
                    checkAuthState();
                } else {
                    alert('Sai tên tài khoản hoặc mật khẩu!');
                }
            });
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            currentUser = null;
            checkAuthState();
        }

        function checkAuthState() {
            const authContainer = document.getElementById('authContainer');
            const appContainer = document.getElementById('appContainer');

            if (currentUser) {
                authContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                
                const addSection = document.getElementById('addOrderSection');
                const tableSection = document.getElementById('tableSection');
                const thOwner = document.getElementById('thOwner');
                const floatingNotification = document.getElementById('floatingNotification');

                if (currentUser === ADMIN_USERNAME) {
                    document.getElementById('userWelcome').innerText = `Quản Trị Viên: ${currentUser}`;
                    addSection.classList.add('hidden');
                    tableSection.classList.remove('lg:col-span-2');
                    tableSection.classList.add('lg:col-span-3');
                    thOwner.classList.remove('hidden');
                    floatingNotification.classList.add('hidden');
                    loadAllOrdersForAdmin();
                } else {
                    document.getElementById('userWelcome').innerText = `Xin chào: ${currentUser}`;
                    addSection.classList.remove('hidden');
                    tableSection.classList.remove('lg:col-span-3');
                    tableSection.classList.add('lg:col-span-2');
                    thOwner.classList.add('hidden');
                    floatingNotification.classList.remove('hidden');
                    loadOrdersRealtime();
                }
            } else {
                authContainer.classList.remove('hidden');
                appContainer.classList.add('hidden');
            }
        }

        function playNotificationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }

        function checkNotifications(orders) {
            const todayStr = new Date().toLocaleDateString('en-GB');
            const badge = document.getElementById('notifBadge');
            const notifList = document.getElementById('notifList');
            const notifCountText = document.getElementById('notifCountText');

            const dueToday = orders.filter(order => order.hatchDate === todayStr);

            notifList.innerHTML = '';
            if (dueToday.length > 0) {
                badge.innerText = dueToday.length;
                badge.classList.remove('hidden');
                notifCountText.innerText = dueToday.length + ' đơn hôm nay';

                dueToday.forEach(order => {
                    const item = document.createElement('div');
                    item.className = "p-3 hover:bg-emerald-50 transition cursor-pointer";
                    item.innerHTML = `
                        <div class="font-semibold text-emerald-800"><i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1"></i> ${order.name} (${order.phone})</div>
                        <div class="text-xs text-gray-600 mt-1">Đến hẹn: <span class="font-bold text-red-600">${order.breedText} - ${order.quantity} con</span></div>
                    `;
                    notifList.appendChild(item);
                });
                playNotificationSound();
            } else {
                badge.classList.add('hidden');
                notifCountText.innerText = '0 đơn';
                notifList.innerHTML = `<div class="p-4 text-center text-gray-400 text-sm">Không có đơn nào đến hạn nở hôm nay.</div>`;
            }
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!currentUser || currentUser === ADMIN_USERNAME) return;

            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            const breedSelect = document.getElementById('breedType');
            const breedText = breedSelect.options[breedSelect.selectedIndex].text.split(' ')[0];
            
            const customPrice = parseInt(document.getElementById('breedPrice').value) || 0;
            const incubateDays = parseInt(breedSelect.options[breedSelect.selectedIndex].getAttribute('data-days'));
            const quantity = parseInt(document.getElementById('quantity').value);
            const orderDateVal = document.getElementById('orderDate').value;
            const deposit = parseInt(document.getElementById('deposit').value) || 0;

            const totalPrice = quantity * customPrice;
            const remainingDebt = totalPrice - deposit;

            const orderDate = new Date(orderDateVal);
            const enterMachineDate = new Date(orderDate);
            const hatchDate = new Date(enterMachineDate);
            hatchDate.setDate(enterMachineDate.getDate() + incubateDays);

            const formatDate = (date) => {
                const d = String(date.getDate()).padStart(2, '0');
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const y = date.getFullYear();
                return `${d}/${m}/${y}`;
            };

            const orderId = 'order_' + Date.now();
            const newOrder = {
                id: orderId,
                name, phone, breedText, quantity,
                price: formatMoney(customPrice),
                enterDate: formatDate(enterMachineDate),
                hatchDate: formatDate(hatchDate),
                debt: formatMoney(remainingDebt)
            };

            db.ref('orders/' + currentUser + '/' + orderId).set(newOrder, (error) => {
                if (!error) {
                    document.getElementById('orderForm').reset();
                    document.getElementById('orderDate').valueAsDate = new Date();
                    updateDefaultPrice();
                }
            });
        });

        function loadOrdersRealtime() {
            if (!currentUser) return;
            db.ref('orders/' + currentUser).on('value', (snapshot) => {
                const data = snapshot.val();
                let allOrders = [];
                if (data) allOrders = Object.values(data);
                cachedOrdersForExport = allOrders.map(o => ({ owner: currentUser, ...o }));
                checkNotifications(allOrders);
                filterOrdersTable();
            });
        }

        function loadAllOrdersForAdmin() {
            if (currentUser !== ADMIN_USERNAME) return;
            db.ref('orders').on('value', (snapshot) => {
                const allUsersData = snapshot.val();
                cachedOrdersForExport = [];
                if (allUsersData) {
                    Object.keys(allUsersData).forEach(username => {
                        const userOrders = allUsersData[username];
                        if (userOrders) {
                            Object.values(userOrders).forEach(order => {
                                cachedOrdersForExport.push({ owner: username, ...order });
                            });
                        }
                    });
                }
                filterOrdersTable();
            });
        }

        function filterOrdersTable() {
            const keyword = document.getElementById('searchKeyword').value.toLowerCase().trim();
            const tableBody = document.getElementById('orderTableBody');
            tableBody.innerHTML = '';

            const filteredOrders = cachedOrdersForExport.filter(order => {
                const nameMatch = order.name.toLowerCase().includes(keyword);
                const phoneMatch = order.phone.toLowerCase().includes(keyword);
                const ownerMatch = order.owner ? order.owner.toLowerCase().includes(keyword) : false;
                return nameMatch || phoneMatch || ownerMatch;
            });

            if (filteredOrders.length === 0) {
                const colSpan = (currentUser === ADMIN_USERNAME) ? 8 : 7;
                tableBody.innerHTML = `<tr><td colspan="${colSpan}" class="p-4 text-center text-gray-400">Không tìm thấy dữ liệu phù hợp.</td></tr>`;
                return;
            }

            filteredOrders.forEach((order) => {
                const displayPrice = order.price ? order.price : '0 đ';
                const row = document.createElement('tr');
                row.className = "hover:bg-gray-50";

                if (currentUser === ADMIN_USERNAME) {
                    row.innerHTML = `
                        <td class="p-3 font-bold text-emerald-700">${order.owner}</td>
                        <td class="p-3">
                            <div class="font-semibold">${order.name}</div>
                            <div class="text-xs text-gray-500">${order.phone}</div>
                        </td>
                        <td class="p-3">
                            <div>${order.breedText}</div>
                            <span class="text-xs text-emerald-600 font-semibold">${order.quantity} con</span>
                        </td>
                        <td class="p-3 text-gray-700">${displayPrice}</td>
                        <td class="p-3 text-emerald-700 font-medium">${order.enterDate}</td>
                        <td class="p-3 text-emerald-800 font-bold">${order.hatchDate}</td>
                        <td class="p-3 text-red-600 font-semibold">${order.debt}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteOrder('${order.id}', '${order.owner}')" class="text-red-400 hover:text-red-600 p-1" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                } else {
                    row.innerHTML = `
                        <td class="p-3">
                            <div class="font-semibold">${order.name}</div>
                            <div class="text-xs text-gray-500">${order.phone}</div>
                        </td>
                        <td class="p-3">
                            <div>${order.breedText}</div>
                            <span class="text-xs text-emerald-600 font-semibold">${order.quantity} con</span>
                        </td>
                        <td class="p-3 text-gray-700">${displayPrice}</td>
                        <td class="p-3 text-emerald-700 font-medium">${order.enterDate}</td>
                        <td class="p-3 text-emerald-800 font-bold">${order.hatchDate}</td>
                        <td class="p-3 text-red-600 font-semibold">${order.debt}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteOrder('${order.id}', '${currentUser}')" class="text-red-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                }
                tableBody.appendChild(row);
            });
        }

        function exportToExcel() {
            if (cachedOrdersForExport.length === 0) {
                alert('Không có dữ liệu!');
                return;
            }
            let csvContent = "\uFEFFChủ Lò,Khách Hàng,Số Điện Thoại,Loại Giống,Số Lượng,Đơn Giá,Ngày Vào Máy,Ngày Nở,Công Nợ\n";
            cachedOrdersForExport.forEach(o => {
                csvContent += `"${o.owner || currentUser}","${o.name}","${o.phone}","${o.breedText}",${o.quantity},"${o.price}","${o.enterDate}","${o.hatchDate}","${o.debt}"\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `sao-luu-${currentUser}.csv`;
            a.click();
        }

        function exportToText() {
            if (cachedOrdersForExport.length === 0) {
                alert('Không có dữ liệu!');
                return;
            }
            let textContent = `DANH SÁCH ĐƠN HÀNG - ${currentUser.toUpperCase()}\n\n`;
            cachedOrdersForExport.forEach((o, i) => {
                textContent += `[${i+1}] Khách: ${o.name} - SĐT: ${o.phone} - ${o.breedText}: ${o.quantity} con - Nợ: ${o.debt}\n`;
            });
            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `danh-sach-${currentUser}.txt`;
            a.click();
        }

        function deleteOrder(id, ownerUser) {
            if (!currentUser) return;
            if (confirm('Bạn có chắc chắn muốn xóa đơn hàng này?')) {
                db.ref('orders/' + ownerUser + '/' + id).remove();
            }
        }
    </script>
</body>
</html>
